[project]
name = "ifac-safeprocess-2027"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "debrevitatevitae", email = "giotb92@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "stagereg[jax]==0.7.0",
]

[project.scripts]
ifac-safeprocess-2027 = "ifac_safeprocess_2027:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "docformatter>=1.7.8",
    "prek>=0.5.10",
    "ruff>=0.17.4",
]
test = [
    "hypothesis>=6.140.4",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"tests/cmapss/test_*.py" = ["E402"]

[tool.docformatter]
recursive = true
black = true
style = "google"
